services:
  # Control de acceso (entrega final): Redis arranca con la lista de usuarios
  # de database/redis/users.acl. El usuario "default" queda deshabilitado, así
  # que toda conexión necesita usuario y contraseña (ver REDIS_URL en .env) y
  # cada servicio solo puede tocar sus keys y comandos. Detalle:
  # docs/decisiones/ADR-009-control-acceso-redis.md
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./database/redis/users.acl:/usr/local/etc/redis/users.acl:ro
    command: redis-server --appendonly yes --aclfile /usr/local/etc/redis/users.acl

  # Componente vectorial (entrega final): PostgreSQL + extensión pgvector,
  # dedicado a los embeddings de las descripciones de producto (recomendación
  # y búsqueda semántica). Es una instancia aparte del PostgreSQL transaccional
  # (que cada quien tiene instalado localmente en el 5432), por eso usa el 5433.
  # Al crearse el volumen por primera vez ejecuta database/vectores/*.sql
  # (extensión, tabla, índice HNSW y roles). Detalle:
  # docs/decisiones/ADR-008-componente-vectorial.md
  vectores:
    image: pgvector/pgvector:0.8.1-pg17
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=tiendaya_vectores
      - POSTGRES_USER=vectores_admin
      - POSTGRES_PASSWORD=vectores_admin_2026
    volumes:
      - vectores_data:/var/lib/postgresql/data
      - ./database/vectores:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectores_admin -d tiendaya_vectores"]
      interval: 5s
      timeout: 5s
      retries: 12

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/tiendaya123
    volumes:
      - neo4j_data:/data

  # Motor de búsqueda del catálogo (Entrega 3). Un solo nodo para desarrollo:
  # sin réplicas (el índice usa number_of_replicas=0) y con la seguridad
  # desactivada por ahora; el control de acceso es tema de la entrega final.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # ------------------------------------------------------------------------
  # Visores (opcionales): interfaces web para mirar los datos. No arrancan con
  # "docker compose up -d"; se levantan aparte con:
  #   docker compose --profile visores up -d
  # Ver README -> "Ver las bases de datos".
  # ------------------------------------------------------------------------

  # Redis -> http://localhost:5540 (ya conectado al Redis de este compose).
  redisinsight:
    image: redis/redisinsight:latest
    profiles: ["visores"]
    ports:
      - "5540:5540"
    environment:
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_ALIAS=TiendaYa (Redis, solo lectura)
      # Visor con el usuario de solo lectura (users.acl): puede mirar todas las
      # keys pero no escribir ni borrar nada.
      - RI_REDIS_USERNAME=tiendaya_lectura
      - RI_REDIS_PASSWORD=lectura_tiendaya_2026
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis

  # Elasticsearch -> http://localhost:5601 (Kibana; usar "Dev Tools" para
  # consultas). Misma versión que el Elasticsearch de arriba.
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: ["visores"]
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

volumes:
  redis_data:
  neo4j_data:
  elasticsearch_data:
  redisinsight_data:
  vectores_data:
