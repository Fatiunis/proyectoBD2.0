services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/tiendaya123
    volumes:
      - neo4j_data:/data

  # Motor de búsqueda del catálogo (Entrega 3). Un solo nodo para desarrollo:
  # sin réplicas (el índice usa number_of_replicas=0) y con la seguridad
  # desactivada por ahora; el control de acceso es tema de la entrega final.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # ------------------------------------------------------------------------
  # Visores (opcionales): interfaces web para mirar los datos. No arrancan con
  # "docker compose up -d"; se levantan aparte con:
  #   docker compose --profile visores up -d
  # Ver README -> "Ver las bases de datos".
  # ------------------------------------------------------------------------

  # Redis -> http://localhost:5540 (ya conectado al Redis de este compose).
  redisinsight:
    image: redis/redisinsight:latest
    profiles: ["visores"]
    ports:
      - "5540:5540"
    environment:
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_ALIAS=TiendaYa (Redis)
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis

  # Elasticsearch -> http://localhost:5601 (Kibana; usar "Dev Tools" para
  # consultas). Misma versión que el Elasticsearch de arriba.
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: ["visores"]
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

volumes:
  redis_data:
  neo4j_data:
  elasticsearch_data:
  redisinsight_data:
